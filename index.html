<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos 2026 | XDDDqwru</title>
  <style>
    :root {
      --bg-base: #fff8f5;
      --text-main: #2d1b15;
      --text-muted: #6e4f45;
      --accent-orange: #ff6b35;
      --accent-salmon: #ff8c7a;
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-bg-hover: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 10px 32px rgba(235, 110, 75, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2.5rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo dinámico con esferas cálidas para el efecto Liquid Glass */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(135deg, #fff6f0 0%, #ffe9df 50%, #fff2eb 100%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.7;
      animation: float 16s infinite ease-in-out alternate;
    }

    .blob-1 {
      width: 460px;
      height: 460px;
      background: #ff9a76;
      top: -100px;
      left: -80px;
    }

    .blob-2 {
      width: 520px;
      height: 520px;
      background: #ffb49a;
      bottom: -140px;
      right: -100px;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 340px;
      height: 340px;
      background: #ffd1a9;
      top: 42%;
      left: 48%;
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.08); }
    }

    /* Clase base Liquid Glass */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: 
        var(--glass-shadow),
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(255, 130, 95, 0.15);
      border-radius: 24px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Sección Acerca de Mí */
    .about-card {
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.22);
      flex-shrink: 0;
      background: #ffd6c9;
    }

    .about-info {
      flex: 1;
      min-width: 240px;
    }

    .badge-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-orange);
      background: rgba(255, 107, 53, 0.12);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
      border: 1px solid rgba(255, 107, 53, 0.2);
    }

    .about-info h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      background: linear-gradient(120deg, #2d1b15, #d95326);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .about-info p {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 1rem;
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-salmon));
      color: #ffffff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .github-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    /* Barra de controles */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .section-title h2 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .section-title span {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    #search {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      width: 100%;
      max-width: 300px;
      font-size: 0.92rem;
      box-shadow: 0 4px 16px rgba(235, 110, 75, 0.08);
      transition: all 0.2s ease;
    }

    #search::placeholder {
      color: #9e7e74;
    }

    #search:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.85);
      border-color: var(--accent-salmon);
      box-shadow: 0 4px 20px rgba(255, 107, 53, 0.18);
    }

    /* Cuadrícula de proyectos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 1.35rem;
    }

    .card {
      padding: 1.45rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.01);
      background: var(--glass-bg-hover);
      box-shadow: 
        0 16px 36px rgba(235, 110, 75, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 1);
    }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.45rem;
    }

    .card h3 a {
      color: var(--text-main);
      text-decoration: none;
      word-break: break-word;
      transition: color 0.2s ease;
    }

    .card h3 a:hover {
      color: var(--accent-orange);
    }

    .description {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.3rem;
      flex-grow: 1;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 140, 122, 0.22);
      padding-top: 0.8rem;
    }

    .lang {
      background: rgba(255, 140, 122, 0.16);
      color: #c94a24;
      font-weight: 600;
      padding: 0.22rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 140, 122, 0.3);
    }

    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      .about-card {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <!-- Sección Acerca de Mí -->
    <section class="liquid-glass about-card">
      <img 
        src="https://github.com/XDDDqwru.png" 
        alt="Avatar de XDDDqwru" 
        class="avatar"
      >
      <div class="about-info">
        <span class="badge-tag">Acerca de mí</span>
        <h1>Hola, soy XDDDqwru</h1>
        <!-- Puedes editar este párrafo con tu propia descripción -->
        <p id="bio">
          Desarrollador entusiasta creando proyectos y experimentando con código durante este 2026. 
          Aquí recopilo todos mis repositorios públicos creados a lo largo del año.
        </p>
        <a href="https://github.com/XDDDqwru" target="_blank" rel="noopener" class="github-btn">
          Ver perfil en GitHub ↗
        </a>
      </div>
    </section>

    <!-- Encabezado de Repositorios -->
    <div class="section-header">
      <div class="section-title">
        <h2>Repositorios de 2026</h2>
        <span id="count">Cargando proyectos...</span>
      </div>
      <input type="text" id="search" placeholder="Buscar proyecto o lenguaje...">
    </div>

    <!-- Lista de Repositorios -->
    <main id="repo-grid" class="grid">
      <div class="status liquid-glass">Conectando con GitHub...</div>
    </main>
  </div>

  <script>
    const USERNAME = "XDDDqwru";
    const TARGET_YEAR = 2026;
    const grid = document.getElementById("repo-grid");
    const countEl = document.getElementById("count");
    const searchInput = document.getElementById("search");
    let repos2026 = [];

    async function loadRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=created&direction=desc`);
        if (!response.ok) throw new Error("No se pudo conectar con la API de GitHub.");

        const allRepos = await response.json();

        repos2026 = allRepos.filter(repo => {
          const createdYear = new Date(repo.created_at).getFullYear();
          return createdYear === TARGET_YEAR;
        });

        renderRepos(repos2026);
      } catch (error) {
        grid.innerHTML = `<div class="status liquid-glass">Error al cargar repositorios: ${error.message}</div>`;
        countEl.textContent = "";
      }
    }

    function renderRepos(list) {
      countEl.textContent = `${list.length} repositorio${list.length === 1 ? "" : "s"} publicado${list.length === 1 ? "" : "s"}`;

      if (list.length === 0) {
        grid.innerHTML = `<div class="status liquid-glass">Aún no hay repositorios creados en ${TARGET_YEAR}.</div>`;
        return;
      }

      grid.innerHTML = list.map(repo => {
        const date = new Date(repo.created_at).toLocaleDateString("es-ES", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        });

        return `
          <article class="card liquid-glass">
            <div>
              <h3><a href="${repo.html_url}" target="_blank" rel="noopener">${repo.name}</a></h3>
              <p class="description">${repo.description || "Sin descripción agregada."}</p>
            </div>
            <div class="meta">
              <span class="lang">${repo.language || "Código"}</span>
              <span>⭐ ${repo.stargazers_count} · ${date}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = repos2026.filter(repo =>
        repo.name.toLowerCase().includes(term) ||
        (repo.description && repo.description.toLowerCase().includes(term)) ||
        (repo.language && repo.language.toLowerCase().includes(term))
      );
      renderRepos(filtered);
    });

    loadRepos();
  </script>
</body>
</html>
